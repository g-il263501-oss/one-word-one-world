<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한마디가 별이 되어 닿기를</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🌌 한마디가 별이 되어 닿기를</h1>

    <p>
        당신의 한마디가<br>
        누군가의 긴 하루를 밝혀줄 수 있습니다.
    </p>

    <div id="star-count">⭐ 0개의 마음</div>

    <textarea
        id="message"
        maxlength="100"
        placeholder="암 환우에게 전하고 싶은 한마디를 남겨주세요."
    ></textarea>

    <button id="submit-button">✨ 한마디 남기기</button>

    <div id="stars"></div>

    <script src="script.js"></script>

</body>
</html>
